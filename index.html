<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom Oktav</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #ffd6e8, transparent 35%),
                radial-gradient(circle at bottom right, #ff9fc5, transparent 40%),
                linear-gradient(135deg, #ffb6d5, #f78fb3, #e978a3);

            position: relative;
        }

        /* Cahaya lembut */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            filter: blur(80px);
            top: -180px;
            left: -150px;
        }

        /* LOGIN CARD */
        .login-box {
            position: relative;
            z-index: 10;
            width: 380px;
            padding: 45px 38px;

            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 28px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(130, 30, 70, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
            filter: drop-shadow(0 5px 8px rgba(160, 40, 90, .25));
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 30px;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(120, 30, 70, .3);
        }

        .subtitle {
            text-align: center;
            color: #fff5fa;
            margin-top: 7px;
            margin-bottom: 30px;
            font-size: 13px;
        }

        /* INPUT */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: white;
            font-size: 13px;
            margin-bottom: 7px;
            padding-left: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 17px;

            border: 1px solid rgba(255, 255, 255, .45);
            outline: none;
            border-radius: 14px;

            background: rgba(255, 255, 255, .22);
            color: white;

            font-size: 14px;

            transition: .3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, .75);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, .32);
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, .25);
        }

        /* BUTTON */
        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #ffe4ef
            );

            color: #d94d82;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: .3s;

            box-shadow: 0 8px 20px rgba(130, 30, 70, .18);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(130, 30, 70, .25);
        }

        .login-btn:active {
            transform: scale(.98);
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: white;
            font-size: 12px;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* SAKURA PARTICLES */
        .sakura {
            position: absolute;
            top: -50px;

            width: 14px;
            height: 14px;

            background: #ffd1e1;

            border-radius: 100% 0 100% 0;

            opacity: .9;

            filter: drop-shadow(
                0 2px 4px rgba(120, 30, 70, .15)
            );

            animation:
                fall linear infinite,
                sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            from {
                transform: translateY(-60px) rotate(0deg);
            }

            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes sway {
            from {
                margin-left: -45px;
            }

            to {
                margin-left: 45px;
            }
        }

        /* Beberapa variasi bunga */
        .sakura:nth-child(1) {
            left: 5%;
            animation-duration: 9s, 2.5s;
            animation-delay: 0s;
        }

        .sakura:nth-child(2) {
            left: 15%;
            animation-duration: 12s, 3s;
            animation-delay: 2s;
            width: 10px;
            height: 10px;
        }

        .sakura:nth-child(3) {
            left: 27%;
            animation-duration: 8s, 2s;
            animation-delay: 1s;
        }

        .sakura:nth-child(4) {
            left: 40%;
            animation-duration: 13s, 3s;
            animation-delay: 4s;
            width: 11px;
            height: 11px;
        }

        .sakura:nth-child(5) {
            left: 52%;
            animation-duration: 10s, 2.5s;
            animation-delay: 0s;
        }

        .sakura:nth-child(6) {
            left: 64%;
            animation-duration: 14s, 3s;
            animation-delay: 3s;
            width: 9px;
            height: 9px;
        }

        .sakura:nth-child(7) {
            left: 75%;
            animation-duration: 9s, 2s;
            animation-delay: 1s;
        }

        .sakura:nth-child(8) {
            left: 88%;
            animation-duration: 12s, 3s;
            animation-delay: 5s;
            width: 12px;
            height: 12px;
        }

        .sakura:nth-child(9) {
            left: 95%;
            animation-duration: 10s, 2.5s;
            animation-delay: 2s;
        }

        .sakura:nth-child(10) {
            left: 33%;
            animation-duration: 15s, 3s;
            animation-delay: 6s;
            width: 8px;
            height: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            .login-box {
                width: calc(100% - 35px);
                padding: 38px 25px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- Sakura -->
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>
    <div class="sakura"></div>

    <!-- Login -->
    <div class="login-box">

        <div class="logo">🌸</div>

        <h1>Blossom Oktav</h1>

        <p class="subtitle">
            Welcome back to your little garden
        </p>

        <form>

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>

            <button class="login-btn" type="submit">
                Login 🌸
            </button>

            <a href="#" class="forgot">
                Forgot your password?
            </a>

        </form>

    </div>

</body>
  </html>
